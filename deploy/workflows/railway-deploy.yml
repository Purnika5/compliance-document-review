name: Deploy to Railway (Production & Demo)

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Phase 1: Pre-Deploy Quality Gate (Lint, Build & Test Verification)
  # ----------------------------------------------------------------------------
  ci-gate:
    name: CI Verification & Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: compliance_doc_review
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Verify Backend Build & Tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: compliance_doc_review
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test-ci-secret-key-12345!
        run: |
          npm ci
          npm run migrate
          npm run seed
          npm test
          npm run build

      - name: Verify Frontend Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: |
          npm ci
          npm run build

  # ----------------------------------------------------------------------------
  # Phase 2: Deploy-on-Push to Railway
  # ----------------------------------------------------------------------------
  deploy-railway:
    name: Trigger Railway Rolling Deployment
    needs: ci-gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Check Railway Credentials
        id: check-token
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "::notice ::RAILWAY_TOKEN secret is not set. If you are using Railway's native GitHub App integration, Railway will automatically trigger deployment on push."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Railway via CLI
        if: steps.check-token.outputs.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "[Deploy] Authenticating with Railway..."
          railway status || true
          echo "[Deploy] Triggering deployment for active environment..."
          railway up --detach
