services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: compliance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-compliance_doc_review}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-compliance_doc_review}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - compliance-network

  # ----------------------------------------------------------------------------
  # 2. Mock Third-Party AI API (Gemini / Groq Simulation)
  # ----------------------------------------------------------------------------
  mock-ai-api:
    build:
      context: ./devops/mock-ai-api
      dockerfile: Dockerfile
    container_name: compliance-mock-ai
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-compliance_doc_review}
    ports:
      - "${MOCK_AI_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - compliance-network

  # ----------------------------------------------------------------------------
  # 3. Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compliance-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-compliance_doc_review}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-super-secret-compliance-jwt-key-change-in-production-2026!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_DIR: uploads/documents
      MAX_FILE_SIZE_MB: 25
      CORS_ORIGIN: "*"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend_uploads:/app/uploads/documents
    depends_on:
      postgres:
        condition: service_healthy
      mock-ai-api:
        condition: service_started
      pii-masker:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - compliance-network

  # ----------------------------------------------------------------------------
  # 4. Frontend Web App (Next.js 16)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: compliance-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      INTERNAL_BACKEND_URL: http://compliance-backend:5000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - compliance-network

  # ----------------------------------------------------------------------------
  # 5. Gemini AI Service (FastAPI)
  # ----------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: compliance-ai
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${AI_PORT:-8000}:8000"
    networks:
      - compliance-network

  # ----------------------------------------------------------------------------
  # 6. PII Masking Engine (FastAPI)
  # ----------------------------------------------------------------------------
  pii-masker:
    build:
      context: ./devops/pii-masker
      dockerfile: Dockerfile
    container_name: compliance-pii-masker
    restart: unless-stopped
    ports:
      - "${PII_MASKER_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - compliance-network

volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  compliance-network:
    driver: bridge
