# Render Infrastructure-as-Code Blueprint
# Springer Capital Compliance Document Review Platform
# Backend REST API, Microservices, and PostgreSQL Database
services:
  # ----------------------------------------------------------------------------
  # 1. Express Backend REST API
  # ----------------------------------------------------------------------------
  - type: web
    name: compliance-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: compliance-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PII_MASKER_URL
        value: http://compliance-pii-masker:8002
      - key: AI_SERVICE_URL
        value: http://compliance-mock-ai:8001
      - key: RETRIEVAL_SERVICE_URL
        value: http://compliance-mock-ai:8001
      - key: CORS_ORIGIN
        value: "*"
      - key: SUPABASE_URL
        value: https://wpvchfdjirdxtcxorzjb.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_j4I8KlfXzwTBzrz1RiX7SA_acZDfM2o
      - key: SUPABASE_SECRET_KEY
        value: sb_secret_Ovwel5u9oBp5SC985OZaxw_A0rsPrQw
      - key: SUPABASE_JWKS_URL
        value: https://wpvchfdjirdxtcxorzjb.supabase.co/auth/v1/.well-known/jwks.json

  # ----------------------------------------------------------------------------
  # 2. PII Masking Engine (Private Microservice)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: compliance-pii-masker
    runtime: docker
    dockerfilePath: ./devops/pii-masker/Dockerfile
    dockerContext: ./devops/pii-masker
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 8002

  # ----------------------------------------------------------------------------
  # 3. Mock AI & Vector Search Service (Private Microservice)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: compliance-mock-ai
    runtime: docker
    dockerfilePath: ./devops/mock-ai-api/Dockerfile
    dockerContext: ./devops/mock-ai-api
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 8001
      - key: DATABASE_URL
        fromDatabase:
          name: compliance-postgres
          property: connectionString

  # ----------------------------------------------------------------------------
  # 4. Gemini Live AI Review Engine (Private Microservice)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: compliance-ai-service
    runtime: docker
    dockerfilePath: ./ai/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    envVars:
      - key: PORT
        value: 8000
      - key: GEMINI_API_KEY
        sync: false

databases:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (pg15 with pgvector extension)
  # ----------------------------------------------------------------------------
  - name: compliance-postgres
    databaseName: compliance_doc_review
    user: postgres
    region: oregon
    plan: starter
